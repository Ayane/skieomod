name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  installers:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      SKIEO_INSTALLER_NO_PAUSE: '1'
      SKIEO_INSTALLER_TOOLS_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest tests.test_installers
      - name: Run the standalone Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: call repository\web\public\install\Install-SkiEO-Windows.cmd
      - name: Run the standalone Linux launcher
        if: runner.os == 'Linux'
        run: bash repository/web/public/install/Install-SkiEO-Linux.sh
  windows-https:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "truststore>=0.10.4,<0.11"
      - run: python -m unittest tests.test_skieo_http
      - name: Verify the public update feed with native Windows TLS
        run: python -c "import ssl; from tools.skieo_http import windows_context; from tools.skieo_loader import fetch_feed; c=windows_context(); assert c.check_hostname and c.verify_mode == ssl.CERT_REQUIRED; print(fetch_feed(timeout=30)['release'])"
  mod:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: python -m pip install 'setuptools>=77' wheel build
      - run: python -m pip install -e . --no-deps numpy
      - run: python tests/run_custom_map_checks.py
      - run: python -m build --wheel --no-isolation --outdir build/wheels
      - run: python tests/check_skieomod_distribution.py build/wheels/*.whl
  website:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: repository/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository/web/package-lock.json
      - run: npm ci
      - run: npm run build
