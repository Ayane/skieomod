limit_req_zone $binary_remote_addr zone=custom_map_auth:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=custom_map_api:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=custom_map_connections:1m;

server {
    listen 80;
    listen [::]:80;
    server_name skieomod.emillon.fr skieomap.emillon.fr;
    location /.well-known/acme-challenge/ { root /var/www/custom-map-acme; }
    location / { return 308 https://skieomod.emillon.fr$request_uri; }
}
# Preserve methods and paths for clients still using the alias.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name skieomap.emillon.fr;
    ssl_certificate /etc/letsencrypt/live/skieomod.emillon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skieomod.emillon.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Installed WinHTTP helpers reject redirects; retain their download URLs.
    location /downloads/ {
        alias /opt/custom-map/current/downloads/;
        autoindex off;
        expires -1;
    }
    location / { return 308 https://skieomod.emillon.fr$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name skieomod.emillon.fr;
    ssl_certificate /etc/letsencrypt/live/skieomod.emillon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skieomod.emillon.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/custom-map/current/repository/web/dist/browser;
    index index.html;
    client_max_body_size 512m;
    client_body_timeout 30s;
    client_body_temp_path /srv/custom-map-data/nginx-body;
    access_log /srv/custom-map-data/logs/access.log;
    error_log /srv/custom-map-data/logs/error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.steamstatic.com https://avatars.fastly.steamstatic.com https://avatars.akamai.steamstatic.com https://cdn.akamai.steamstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /auth/ {
        access_log off;
        limit_req zone=custom_map_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location /api/ {
        limit_req zone=custom_map_api burst=50 nodelay;
        limit_conn custom_map_connections 4;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    location = /publish { return 302 "/#publier"; }
    location /packages/ { return 302 "/#en-jeu"; }
    location /docs/ { alias /opt/custom-map/current/docs/; default_type text/plain; }
    location /editor/ { return 302 /docs/editor.md; }
    # Stable links and the current package index must be revalidated on every use.
    location = /downloads/CustomMap-Tools.zip {
        alias /opt/custom-map/current/downloads/CustomMap-Tools.zip;
        expires -1;
    }
    location = /downloads/CustomMap-Mod.zip {
        alias /opt/custom-map/current/downloads/CustomMap-Mod.zip;
        expires -1;
    }
    location = /downloads/loader-latest.json {
        alias /opt/custom-map/current/downloads/loader-latest.json;
        expires -1;
    }
    location = /downloads/getting-started.md {
        alias /opt/custom-map/current/downloads/getting-started.md;
        default_type text/plain;
        expires -1;
    }
    # pipx bootstraps/updates its own pip from the selected index as well.
    location = /downloads/pypi/pip/ {
        expires -1;
        return 302 https://pypi.org/simple/pip/;
    }
    # Desktop workshop dependencies are resolved from their canonical PyPI index.
    location ~ ^/downloads/pypi/(pyside6-essentials|shiboken6|pyqtgraph|pyopengl|numpy|colorama|truststore)/$ {
        expires -1;
        return 302 https://pypi.org/simple/$1/;
    }
    location /downloads/pypi/ {
        alias /opt/custom-map/current/downloads/pypi/;
        index index.html;
        expires -1;
    }
    location /downloads/ { alias /opt/custom-map/current/downloads/; autoindex off; }
    location / { try_files $uri $uri/ /index.html; }
}
