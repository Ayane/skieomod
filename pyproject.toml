[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skieo-custom-map"
version = "1.24.0"
description = "Create, build, run and prepare Ski-E-O! maps and mods for Steam Workshop"
authors = [{name = "Albatar (Élie Millon)"}]
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.8,<7", "pyqtgraph>=0.14,<0.15", "PyOpenGL>=3.1.7,<4", "numpy>=1.26,<3"]
readme = "docs/getting-started.md"

[project.urls]
Homepage = "https://skieomod.emillon.fr"
Repository = "https://github.com/Ayane/skieomod"
Issues = "https://github.com/Ayane/skieomod/issues"

[project.scripts]
skieomod = "custom_map:main"

[tool.setuptools]
py-modules = ["custom_map", "custom_maps", "custom_packages", "skieo_install", "skieo_uninstall", "skieo_loader", "skieo_updates", "skieo_project", "skieo_templates", "skieo_workshop", "skieo_repository", "skieo_heightmap", "skieo_bake", "skieo_authoring", "skieo_game_catalog", "skieo_scene", "skieo_editor_scene", "skieo_editor", "skieo_editor_ui", "skieo_editor_widgets", "skieo_editor_config", "skieo_editor_3d", "skieo_editor_graph", "skieo_editor_resources"]
package-dir = {"" = "tools"}

[tool.setuptools.data-files]
"share/skieomod/SkiEO-CustomMaps" = ["mod/SkiEO-CustomMaps/README.md", "mod/SkiEO-CustomMaps/LICENSE", "mod/SkiEO-CustomMaps/LICENSE-miniz.txt", "mod/SkiEO-CustomMaps/LICENSE-MINHOOK.md", "docs/getting-started.md"]
"share/skieomod/SkiEO-CustomMaps/Scripts" = ["mod/SkiEO-CustomMaps/Scripts/*.lua", "mod/SkiEO-CustomMaps/Scripts/skieo_repository.dll", "mod/SkiEO-CustomMaps/Scripts/skieo_native_terrain.dll", "mod/SkiEO-CustomMaps/Scripts/skieo_trail_ratings.dll"]
"share/skieomod/docs" = ["CHANGELOG.md", "docs/discord-releases.md", "docs/getting-started.md", "docs/large-maps.md", "docs/terrain-repairs.md", "docs/vegetation.md", "docs/custom-map-cli.md", "docs/custom-map-repository.md", "docs/custom-map-format.md", "docs/steam-workshop.md", "docs/editor.md", "docs/editor-tutorial.md", "docs/scripts-and-scenarios.md", "docs/mapmods.md", "docs/mapmod-tutorial.md"]
"share/skieomod/schemas" = ["schemas/custom-map.schema.json", "schemas/custom-mod.schema.json", "schemas/workshop-client.schema.json", "schemas/vegetation.schema.json", "schemas/triggers.schema.json", "schemas/resources.schema.json", "schemas/scene.schema.json"]
