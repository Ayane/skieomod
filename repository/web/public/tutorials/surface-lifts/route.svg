<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">One native lift, one configured surface-lift route</title><desc id="desc">The lower and upper scene terminals use metres. The matching mapmod route uses centimetres and runs uphill from bottom to top. The ascent is on the left when viewed uphill.</desc>
