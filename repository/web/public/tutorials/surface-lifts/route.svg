<path d="M215 366L920 110" fill="none" stroke="#ca603c" stroke-width="5"/>
<path d="M245 410L950 154" fill="none" stroke="#527966" stroke-width="3" stroke-dasharray="10 10"/>
<g fill="#172f29"><path d="M377 340v-51h-29v-10h62v10h-26v51ZM518 289v-51h-29v-10h62v10h-26v51ZM659 238v-51h-29v-10h62v10h-26v51ZM800 187v-51h-29v-10h62v10h-26v51Z"/></g>
